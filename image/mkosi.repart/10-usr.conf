# /usr, slot A: the whole OS, read-only (erofs) and integrity-checked (dm-verity).
# Each UKI carries usrhash= for its own /usr, so picking a boot entry picks the slot.
[Partition]
Type=usr
Label=musicos_%A
Format=erofs
Compression=lz4hc
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
SizeMinBytes=2560M
SizeMaxBytes=2560M
SplitName=usr.%U
