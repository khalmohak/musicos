# musicos appliance image. Build on a Debian trixie host: `make image` (see README).
# Docs: https://github.com/systemd/mkosi/blob/main/mkosi/resources/man/mkosi.1.md

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# firmware for real GPUs, Wi-Fi, NICs and audio DSPs lives in non-free-firmware
Repositories=non-free-firmware

[Output]
Format=disk
ImageId=musicos
OutputDirectory=../out

[Build]
# Keeps downloaded .debs between builds (gitignored)
CacheDirectory=mkosi.cache

[Content]
Timezone=Asia/Kolkata
Bootable=yes
Bootloader=systemd-boot
Hostname=musicos
# console=tty0 last so it is /dev/console; serial for `qm terminal` / headless debugging
KernelCommandLine=console=ttyS0 console=tty0 quiet splash loglevel=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0
# DEV ONLY: remove before putting this on a real network
RootPassword=musicos
WithDocs=no

ExtraTrees=../agent:/opt/musicos/agent
# built by `make ui` (Vite); the pipeline builds it before syncing
ExtraTrees=../ui/dist:/opt/musicos/ui

Packages=
        # base system
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        # grows the root partition to fill the disk on first boot (/etc/repart.d)
        systemd-repart
        libpam-systemd
        udev
        dbus
        iproute2
        ca-certificates
        openssh-server
        sudo
        less
        nano
        # real hardware: GPU/Wi-Fi/NIC/audio firmware and CPU microcode
        firmware-linux-free
        firmware-misc-nonfree
        firmware-amd-graphics
        firmware-intel-graphics
        firmware-realtek
        firmware-iwlwifi
        firmware-sof-signed
        intel-microcode
        amd64-microcode
        mesa-vulkan-drivers
        # lets Proxmox read the IP and run test commands; idle on real hardware
        qemu-guest-agent
        # player
        python3
        python3-pil
        mpd
        mpc
        alsa-utils
        # display: Wayland kiosk compositor + WPE WebKit browser
        cage
        cog
        libgl1-mesa-dri
        libegl-mesa0
        fonts-noto-core
        # WebKit audio (interface sounds)
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        gstreamer1.0-alsa
        # boot splash
        plymouth
        plymouth-label
        # network: Ethernet + Wi-Fi (NetworkManager), musicos.local, clock sync
        network-manager
        polkitd
        iw
        wireless-regdb
        avahi-daemon
        libnss-mdns
        systemd-timesyncd
        # music sources: network shares, and drives formatted on Mac/Windows/Linux
        cifs-utils
        nfs-common
        exfatprogs
        dosfstools
        ntfs-3g
