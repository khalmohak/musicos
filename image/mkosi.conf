# musicos appliance image. Build on a Debian trixie host: `make image` (see README).
# Docs: https://github.com/systemd/mkosi/blob/main/mkosi/resources/man/mkosi.1.md

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=musicos
OutputDirectory=../out

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=musicos
# console=tty0 last so it is /dev/console; serial for `qm terminal` / headless debugging
KernelCommandLine=console=ttyS0 console=tty0 quiet loglevel=3
# DEV ONLY: remove before putting this on a real network
RootPassword=musicos
WithDocs=no

ExtraTrees=../agent:/opt/musicos/agent
ExtraTrees=../ui:/opt/musicos/ui

Packages=
        # base system
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        libpam-systemd
        udev
        dbus
        iproute2
        ca-certificates
        openssh-server
        sudo
        less
        nano
        # player
        python3
        mpd
        mpc
        alsa-utils
        # display: Wayland kiosk compositor + WPE WebKit browser
        cage
        cog
        libgl1-mesa-dri
        libegl-mesa0
        fonts-noto-core
        # network music sources
        cifs-utils
        nfs-common
