# musicos appliance image. Build on a Debian trixie host: `make image` (see README).
# Docs: https://github.com/systemd/mkosi/blob/main/mkosi/resources/man/mkosi.1.md

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
# firmware for real GPUs, Wi-Fi, NICs and audio DSPs lives in non-free-firmware
Repositories=non-free-firmware

[Output]
Format=disk
ImageId=musicos
OutputDirectory=../out
# A/B updates: also write the /usr + verity partitions and the UKI as separate files
# (scripts/publish-update.sh turns them into an update). The version comes from mkosi.version.
SplitArtifacts=partitions,uki

[Build]
# Keeps downloaded .debs between builds (gitignored)
CacheDirectory=mkosi.cache
# Local packages not in Debian: raspotify (librespot, Spotify Connect), fetched pinned +
# checksummed by scripts/fetch-spotify.sh before every build
PackageDirectories=mkosi.packages

[Content]
# UKIs are named per version so systemd-boot keeps both and sysupdate can replace the old one
UnifiedKernelImageFormat=musicos_%v
# initrd must be able to set up dm-verity and mount the erofs /usr
InitrdPackages=systemd-cryptsetup
        # trial boot of a bad update: reboot (and roll back) instead of an emergency prompt
        musicos-initrd
KernelModulesInitrdInclude=default
        erofs
        dm-verity
# the initrd only needs to find and mount the disks; GPU/Wi-Fi/sound drivers (and their large
# firmware) load later from /usr. Keeps each UKI small enough for two in the ESP.
KernelModulesInitrdExclude=drivers/gpu/.*
        sound/.*
        drivers/net/wireless/.*
        net/wireless/.*
        drivers/bluetooth/.*
        drivers/media/.*
        drivers/infiniband/.*
Timezone=Asia/Kolkata
Bootable=yes
Bootloader=systemd-boot
Hostname=musicos
# console=tty0 last so it is /dev/console; serial for `qm terminal` / headless debugging.
# fsck.repair=yes: a data partition damaged by a power cut is repaired at boot without asking.
KernelCommandLine=console=ttyS0 console=tty0 fsck.repair=yes quiet splash loglevel=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0
# DEV ONLY: remove before putting this on a real network
RootPassword=musicos
WithDocs=no

ExtraTrees=../agent:/usr/lib/musicos/agent
# built by `make ui` (Vite); the pipeline builds it before syncing
ExtraTrees=../ui/dist:/usr/share/musicos/ui

Packages=
        # base system
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        # grows the root partition to fill the disk on first boot (/usr/lib/repart.d)
        systemd-repart
        # systemd-sysupdate (A/B updates) ships in systemd-container on Debian
        systemd-container
        libpam-systemd
        udev
        dbus
        iproute2
        ca-certificates
        openssh-server
        sudo
        less
        pciutils
        nano
        # real hardware: GPU/Wi-Fi/NIC/audio firmware and CPU microcode
        firmware-linux-free
        firmware-misc-nonfree
        firmware-amd-graphics
        firmware-intel-graphics
        # GTX 16xx/RTX: nouveau needs this firmware for 3D (GSP)
        firmware-nvidia-graphics
        firmware-realtek
        firmware-iwlwifi
        firmware-mediatek
        firmware-atheros
        firmware-brcm80211
        firmware-ath9k-htc
        firmware-sof-signed
        intel-microcode
        amd64-microcode
        mesa-vulkan-drivers
        # lets Proxmox read the IP and run test commands; idle on real hardware
        qemu-guest-agent
        # player
        python3
        python3-pil
        mpd
        mpc
        alsa-utils
        # Bluetooth: controllers, keyboards, headphones/speakers (bluez-alsa for audio)
        bluez
        bluez-alsa-utils
        # AirPlay receiver
        shairport-sync
        # Spotify Connect (librespot), from mkosi.packages/ (scripts/fetch-spotify.sh)
        raspotify
        # display mode switching under cage
        wlr-randr
        # controllers, IR receivers, HDMI-CEC
        python3-evdev
        v4l-utils
        ir-keytable
        # display: Wayland kiosk compositor + WPE WebKit browser
        cage
        cog
        libgl1-mesa-dri
        libegl-mesa0
        fonts-noto-core
        # WebKit audio (interface sounds)
        gstreamer1.0-plugins-base
        gstreamer1.0-plugins-good
        gstreamer1.0-alsa
        # boot splash
        plymouth
        plymouth-label
        # network: Ethernet + Wi-Fi (NetworkManager), musicos.local, clock sync
        network-manager
        # NetworkManager can't drive any Wi-Fi card without wpa_supplicant (only a Recommends)
        wpasupplicant
        rfkill
        usbutils
        polkitd
        iw
        wireless-regdb
        avahi-daemon
        libnss-mdns
        # chrony, not systemd-timesyncd: timesyncd waits for systemd-networkd to say the
        # network is up, and NetworkManager runs the network here, so it never synced
        chrony
        # music sources: network shares, and drives formatted on Mac/Windows/Linux
        cifs-utils
        smbclient
        avahi-utils
        nfs-common
        exfatprogs
        dosfstools
        ntfs-3g
        # updates (unpacking) + install to disk
        zstd
        rsync
        efibootmgr
        fdisk
        gdisk
        parted
        e2fsprogs
        # diagnostics over SSH
        curl
        lsof
        htop
        strace
        ethtool
        bind9-dnsutils
        iputils-ping
        traceroute
        mtr-tiny
        tcpdump
        iperf3
        smartmontools
        nvme-cli
        lshw
