# musicos MPD config. Music lives at /srv/music:
#   /srv/music/local        files copied onto the device
#   /srv/music/usb-<uuid>   USB drives (auto-mounted, read-only)
#   /srv/music/net-<id>     network shares added in setup (auto-mounted, read-only)
music_directory     "/srv/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
user                "mpd"
group               "audio"
bind_to_address     "127.0.0.1"
port                "6600"
auto_update         "yes"
restore_paused      "yes"
filesystem_charset  "UTF-8"

# Output device chosen in setup; written by musicos-apply (see agent/musicos_agent/apply.py)
include_optional    "/var/lib/musicos/mpd-output.conf"
