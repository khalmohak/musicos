# AirPlay receiver with musicos' config; name from Settings (/etc/musicos/receivers.env)
[Unit]
After=avahi-daemon.service musicos-apply.service

[Service]
EnvironmentFile=/usr/share/musicos/receivers.env
EnvironmentFile=-/etc/musicos/receivers.env
ExecStart=
ExecStart=/usr/bin/shairport-sync --configfile=/usr/share/musicos/shairport-sync.conf -a ${RECEIVER_NAME}
