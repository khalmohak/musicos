# Audio defaults (/etc/asound.conf, mpd-output.conf) are written by musicos-apply before MPD starts.
[Unit]
Wants=musicos-apply.service
After=musicos-apply.service

# musicos' MPD config ships in /usr so it updates with the system (A/B updates)
[Service]
ExecStart=
ExecStart=/usr/bin/mpd --systemd /usr/share/musicos/mpd.conf
