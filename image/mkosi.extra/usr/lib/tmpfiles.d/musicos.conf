# Writable state on the root partition (survives A/B updates)
d /var/lib/musicos          0755 music music -
d /var/lib/musicos/updates  0755 music music -
d /var/lib/musicos/library  0755 music music -
d /srv/music                0755 root  root  -
d /srv/music/local          2775 music audio -
d /etc/musicos              0755 root  root  -
d /etc/musicos/creds        0700 root  root  -
d /var/cache/musicos-spotify 0750 music audio -
# default MPD output until setup / musicos-apply writes the real one
C /var/lib/musicos/mpd-output.conf 0644 root root - /usr/share/musicos/mpd-output.default.conf
# AirPlay metadata pipe (shairport-sync writes, the agent reads)
d /run/musicos                     0755 root root -
p /run/musicos/shairport-metadata  0666 root root -
