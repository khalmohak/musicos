// AirPlay receiver (shairport-sync). The name comes from RECEIVER_NAME (-a), see the drop-in.
general = {
    output_backend = "alsa";
    interpolation = "auto";
};
alsa = {
    output_device = "default";   // dmix: shares the output with interface sounds
};
sessioncontrol = {
    run_this_before_play_begins = "/usr/local/lib/musicos/receiver airplay start";
    run_this_after_play_ends = "/usr/local/lib/musicos/receiver airplay stop";
    wait_for_completion = "no";
    allow_session_interruption = "yes";
};
metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    pipe_name = "/run/musicos/shairport-metadata";
    pipe_timeout = 5000;
};
