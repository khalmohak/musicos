# MPD for local UI development on macOS:  brew install mpd && make dev-mpd
# Points at the homelab library mounted by Finder. First scan over SMB takes a while.
music_directory     "/Volumes/8TB/media/music/library"
db_file             "~/.musicos-dev/db"
state_file          "~/.musicos-dev/state"
playlist_directory  "~/.musicos-dev/playlists"
log_file            "~/.musicos-dev/log"
bind_to_address     "127.0.0.1"
port                "6600"
auto_update         "no"

audio_output {
    type    "osx"
    name    "Mac output"
    mixer_type "software"
}
